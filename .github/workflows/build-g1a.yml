name: Build Hangul.g1a

# Builds fx9860g3-hangul into dist/Hangul.g1a (download it from the run's Artifacts).
# The first run compiles the SH cross compiler + fxSDK + gint (30-60+ min); the result
# is cached in ~/.local, so later runs only take a minute or two.
# NOTE: as of 2026-10 the fxSDK Gitea host (git.planet-casio.com) does not accept
# connections from GitHub's runners (timeouts), so this build cannot succeed there.
# Manual trigger only, kept for the day it works (or for a self-hosted runner).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 python3-pip pkg-config \
            texinfo bison flex libgmp-dev libmpfr-dev libmpc-dev libisl-dev libpng-dev \
            libusb-1.0-0-dev libudev-dev libsdl2-dev libncurses-dev libfreetype-dev \
            libssl-dev
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: fxsdk-toolchain-ubuntu2204-v1

      - name: Network diagnostics
        if: steps.tc.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          for h in gitea.planet-casio.fr planet-casio.fr github.com; do
            echo "== $h"; getent hosts "$h" || echo "dns: no result"
            curl -sS -m 15 -o /dev/null -w "http %{http_code}\n" "https://$h/" || true
          done
          cat /etc/resolv.conf

      - name: Build toolchain (first run only)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global url."https://git.planet-casio.com/".insteadOf "https://gitea.planet-casio.fr/"
          for i in 1 2 3 4 5; do
            git clone --depth 1 https://git.planet-casio.com/Lephenixnoir/GiteaPC.git /tmp/GiteaPC && break
            echo "clone failed (attempt $i), retrying in 30s"; sleep 30
          done
          test -d /tmp/GiteaPC
          cd /tmp/GiteaPC && make install
          giteapc --version || true
          giteapc install -y Lephenixnoir/sh-elf-gcc
          giteapc install -y Lephenixnoir/fxsdk Lephenixnoir/OpenLibm Lephenixnoir/gint

      - name: Generate assets and build
        working-directory: fx9860g3-hangul
        run: |
          python3 tools/build_assets.py
          fxsdk build-fx

      - uses: actions/upload-artifact@v4
        with:
          name: Hangul-g1a
          path: fx9860g3-hangul/dist/Hangul.g1a
          if-no-files-found: error
