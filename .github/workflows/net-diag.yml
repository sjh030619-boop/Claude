name: Net diag (temporary)
on:
  push:
    paths:
      - '.github/workflows/net-diag.yml'
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          for h in gitea.planet-casio.com git.planet-casio.com; do
            echo "== redirects for $h"
            curl -sSIL -m 25 "https://$h/Lephenixnoir/GiteaPC" 2>&1 | grep -i -E "^(HTTP|location|curl)" || true
            echo "== clone via $h"
            GIT_TERMINAL_PROMPT=0 timeout 60 git clone --depth 1 "https://$h/Lephenixnoir/GiteaPC.git" "/tmp/gpc-$h" 2>&1 | tail -3 || true
            ls "/tmp/gpc-$h" 2>/dev/null | head -20
          done
